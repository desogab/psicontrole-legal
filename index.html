<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PsiControle: app para psicólogos no iPhone e no Mac</title>
  <meta name="description" content="Agenda, pacientes, notas clínicas e recebimentos para psicólogos no iPhone e no Mac. Disponível em português, inglês e espanhol.">
  <meta property="og:image" content="https://psicontrole.app.br/assets/img/pt-BR/og.jpg">
  <link rel="icon" href="assets/img/brand/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/img/brand/apple-touch-icon.png">
  <meta name="theme-color" content="#f5f7f8">
  <link rel="stylesheet" href="styles.css?v=20261116">
  <script>
    (function () {
      var savedLanguage = "";
      var browserLanguage = "";

      try {
        savedLanguage = localStorage.getItem("psicontrole-language") || "";
      } catch (error) {
        savedLanguage = "";
      }

      if (navigator.languages && navigator.languages.length) {
        browserLanguage = navigator.languages[0];
      } else {
        browserLanguage = navigator.language || "";
      }

      savedLanguage = String(savedLanguage).toLowerCase();
      browserLanguage = String(browserLanguage).toLowerCase();

      var target = "pt-BR/";

      if (savedLanguage === "es-es") {
        target = "es-ES/";
      } else if (savedLanguage === "en") {
        target = "en/";
      } else if (savedLanguage === "pt-br") {
        target = "pt-BR/";
      } else if (browserLanguage.indexOf("es") === 0) {
        target = "es-ES/";
      } else if (browserLanguage.indexOf("en") === 0) {
        target = "en/";
      }

      window.location.replace(target);
    })();
  </script>
  <!-- seo:start -->
  <link rel="canonical" href="https://psicontrole.app.br/">
  <link rel="alternate" hreflang="pt-BR" href="https://psicontrole.app.br/pt-BR/">
  <link rel="alternate" hreflang="en" href="https://psicontrole.app.br/en/">
  <link rel="alternate" hreflang="es-ES" href="https://psicontrole.app.br/es-ES/">
  <link rel="alternate" hreflang="x-default" href="https://psicontrole.app.br/">
  <!-- seo:end -->
</head>

      <a class="button button-secondary" href="es-ES/" lang="es-ES">Español (España)</a>

    </div>

</body>
</html>
