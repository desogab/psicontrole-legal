<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PsiControle</title>
  <meta name="description" content="PsiControle — agenda clínica, pacientes e recebíveis no seu iPhone.">
  <link rel="canonical" href="pt-BR/">
  <link rel="icon" href="assets/img/brand/app-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      var savedLanguage = "";
      var browserLanguage = "";

      try {
        savedLanguage = localStorage.getItem("psicontrole-language") || "";
      } catch (error) {
        savedLanguage = "";
      }

      if (navigator.languages && navigator.languages.length) {
        browserLanguage = navigator.languages[0];
      } else {
        browserLanguage = navigator.language || "";
      }

      savedLanguage = String(savedLanguage).toLowerCase();
      browserLanguage = String(browserLanguage).toLowerCase();

      var target = "pt-BR/";

      if (savedLanguage === "en") {
        target = "en/";
      } else if (savedLanguage === "pt-br") {
        target = "pt-BR/";
      } else if (browserLanguage.indexOf("en") === 0) {
        target = "en/";
      }

      window.location.replace(target);
    })();
  </script>
</head>
<body class="redirect-page">
  <main class="redirect-card" aria-labelledby="redirect-title">
    <img src="assets/img/brand/brand-mark.png" alt="" width="96" height="96">
    <h1 id="redirect-title">PsiControle</h1>
    <p>Escolha uma versão para abrir o site.</p>
    <div class="redirect-actions" aria-label="Idiomas disponíveis">
      <a class="button button-primary" href="pt-BR/">Português</a>
      <a class="button button-secondary" href="en/">English</a>
    </div>
  </main>
</body>
</html>
